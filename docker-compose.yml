services:
  postgres:
    image: postgres:16-alpine
    container_name: refurbicon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: refurbicon
      POSTGRES_PASSWORD: refurbicon
      POSTGRES_DB: refurbiconerp
    ports:
      - "5432:5432"
    volumes:
      - refurbicon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refurbicon -d refurbiconerp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: refurbicon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - refurbicon_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  refurbicon_pg:
  refurbicon_redis:
